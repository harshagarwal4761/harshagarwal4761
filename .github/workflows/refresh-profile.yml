name: Refresh chess profile

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/refresh-profile.yml'

permissions:
  contents: write

concurrency:
  group: chess-profile-refresh
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image renderer
        run: python -m pip install Pillow==12.3.0
      - name: Render public GitHub stats and chess animations
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/render_profile.py
      - name: Save refreshed cards
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/player-card.* assets/contribution-board.* assets/ai-tools.png assets/file-scanner.png assets/sps-project.png
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh chess profile cards'
            git push
          fi
